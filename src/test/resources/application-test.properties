# Test Configuration for Fix4Home Backend
spring.application.name=fix4home-test

# Server Configuration
server.port=0

# Database Configuration - Use H2 for unit tests, TestContainers for integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Disable Flyway for unit tests
spring.flyway.enabled=false

# JWT Configuration for Testing
jwt.secret=test-secret-key-for-testing-only-not-for-production
jwt.expiration=900000
jwt.refresh-token.expiration=2592000000

# Disable security features for testing
admin.registration.key=TEST_ADMIN_KEY
admin.registration.enabled=true

# File Storage Configuration for Testing
file.storage.type=local
file.storage.local.upload-dir=target/test-uploads/
file.storage.local.base-url=http://localhost:8100/api/v1/files/
file.storage.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,txt
file.storage.max-file-size=10485760

# Disable external services for testing
push.notification.enabled=false
email.verification.service.url=http://localhost:8200
email.verification.service.api-key=test-api-key

# Logging Configuration for Testing
logging.level.com.fix4home=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Redis Configuration for Testing - Use embedded Redis or mock
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=1
spring.data.redis.timeout=1000ms

# Cache Configuration for Testing
cache.enabled=false

# Monitoring disabled for testing
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Rate Limiting disabled for testing
rate.limit.refresh.requests=1000
rate.limit.refresh.duration=1

# Vietnam Address API mock for testing
vietnam.address.api.url=http://localhost:8080/api/v1
vietnam.address.api.timeout=1000

# Database backup disabled for testing
database.backup.enabled=false