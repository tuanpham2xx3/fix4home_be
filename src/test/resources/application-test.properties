# Test Configuration
# =================

# Database Configuration (H2 for fast testing)
spring.datasource.url=jdbc:h2:mem:fix4home_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=test
spring.datasource.password=test

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration (disabled for tests using H2)
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=testSecretKeyForJwtTokenProviderThatNeedsToBeAtLeast256BitsLongForHmacSha256Algorithm
jwt.expiration=3600000

# Redis Configuration (disabled for testing)
spring.cache.type=none
spring.data.redis.host=disabled

# Email Configuration (mock for testing)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
email.verification.service.api-key=test_api_key

# File Upload Configuration
file.upload.directory=./test-uploads
file.upload.max-size=10MB

# Logging Configuration
logging.level.com.fix4home=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Disable banner for cleaner test output
spring.main.banner-mode=off

# Test Data Configuration
test.data.create-sample=false
test.cleanup.enabled=true

# Security Configuration
security.jwt.test-mode=true
security.cors.test-origins=http://localhost:3000,http://localhost:8080

# Performance Testing
spring.jpa.properties.hibernate.generate_statistics=true

# Profile specific settings
spring.profiles.active=test
