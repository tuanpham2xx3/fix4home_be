# Production Configuration for Fix4Home Backend
spring.application.name=fix4home

# Server Configuration
server.port=8100
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Security Configuration - Use environment variables in production
admin.registration.key=${ADMIN_REGISTRATION_KEY}
admin.registration.enabled=false

# Database Configuration - Production MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Enhanced HikariCP Connection Pool Configuration for Production
spring.datasource.hikari.pool-name=Fix4HomeHikariPool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-init-sql=SET SESSION sql_mode='STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO'

# JPA Configuration - Production optimized
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# JWT Configuration - Use strong secrets in production
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-token.expiration=2592000000

# Cookie Configuration - Production security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.domain=${COOKIE_DOMAIN:fix4home.com}

# SSL Configuration
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_PASSWORD}
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=fix4home

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB

# File Storage Configuration
file.storage.type=${FILE_STORAGE_TYPE:s3}
file.storage.local.upload-dir=uploads/
file.storage.local.base-url=${FILE_STORAGE_LOCAL_BASE_URL:https://api.fix4home.com/api/v1/files/}
file.storage.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,txt
file.storage.max-file-size=10485760
file.storage.image.max-width=2048
file.storage.image.max-height=2048
file.storage.image.thumbnail.width=300
file.storage.image.thumbnail.height=300

# AWS S3 Configuration for Production
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${AWS_S3_BUCKET:fix4home-production-files}

# Logging Configuration - Production
logging.level.com.fix4home=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n
logging.file.name=logs/fix4home.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.file.total-size-cap=1GB

# Rate Limiting - Production
rate.limit.refresh.requests=30
rate.limit.refresh.duration=60

# Push Notification Configuration
push.notification.enabled=true
push.notification.fcm.service-account-key=${FCM_SERVICE_ACCOUNT_KEY}
push.notification.fcm.project-id=${FCM_PROJECT_ID}
push.notification.apns.certificate-path=${APNS_CERTIFICATE_PATH}
push.notification.apns.certificate-password=${APNS_CERTIFICATE_PASSWORD}
push.notification.apns.production=true
push.notification.batch-size=100
push.notification.retry-attempts=3
push.notification.retry-delay-seconds=5

# Email Verification Service Configuration
email.verification.service.url=${EMAIL_VERIFICATION_SERVICE_URL:https://email-service.fix4home.com}
email.verification.service.api-key=${EMAIL_VERIFICATION_API_KEY}
email.verification.system.name=Fix4Home

# Production Monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=fix4home
management.metrics.tags.environment=production
management.metrics.export.prometheus.enabled=true

# Vietnam Administrative API Configuration
vietnam.address.api.url=${VIETNAM_ADDRESS_API_URL:https://api.address.vietnam.gov.vn/api/v1}
vietnam.address.api.timeout=5000

# Database Backup Configuration
database.backup.enabled=true
database.backup.schedule.cron=0 0 2 * * ?
database.backup.retention.days=90
database.backup.location=s3://fix4home-backups/database/
database.backup.compress=true
database.backup.notification.enabled=true
database.backup.notification.email=${DB_BACKUP_EMAIL:admin@fix4home.com}

# Redis Configuration - Production
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis.fix4home.com}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms

# Cache Configuration
cache.default.ttl=3600
cache.enabled=true

# Error Monitoring Configuration
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production
sentry.traces-sample-rate=0.1

# Performance Monitoring
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000
