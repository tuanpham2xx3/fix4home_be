# Application name
spring.application.name=fix4home

# Server Configuration
server.port=8100

# Security Configuration
admin.registration.key=FIX4HOME_ADMIN_SECRET_2024
admin.registration.enabled=true

# Database Configuration  
spring.datasource.url=jdbc:mysql://localhost:3307/fix4home_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=pass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration  
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Configuration (disabled since we manually created schema)
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:fix4home-secret-key-2024-very-long-and-secure}
jwt.expiration=900000
jwt.refresh-token.expiration=2592000000

# Cookie Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.domain=${COOKIE_DOMAIN:localhost}

# SSL Configuration (disabled for testing)
server.ssl.enabled=false
# server.ssl.key-store=${SSL_KEYSTORE:keystore.p12}
# server.ssl.key-store-password=${SSL_PASSWORD:fix4home}
# server.ssl.keyStoreType=PKCS12
# server.ssl.keyAlias=tomcat

# File Upload Configuration (for future use)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.fix4home=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Rate Limiting
rate.limit.refresh.requests=10
rate.limit.refresh.duration=60

# Email Verification Service Configuration
email.verification.service.url=http://localhost:8200
email.verification.service.api-key=${EMAIL_VERIFICATION_API_KEY:fix4home_prod_123abc456def789}
email.verification.system.name=Fix4Home

# Monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=fix4home

# Vietnam Administrative API Configuration
vietnam.address.api.url=${VIETNAM_ADDRESS_API_URL:http://localhost:8080/api/v1}
vietnam.address.api.timeout=5000
