# Application name
spring.application.name=fix4home

# Server Configuration
server.port=8100

# Security Configuration
admin.registration.key=FIX4HOME_ADMIN_SECRET_2024
admin.registration.enabled=true

# Database Configuration  
spring.datasource.url=jdbc:mysql://localhost:3307/fix4home_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=pass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.pool-name=Fix4HomeHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000

# JPA Configuration  
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:fix4home-secret-key-2024-very-long-and-secure}
jwt.expiration=900000
jwt.refresh-token.expiration=2592000000

# Cookie Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.domain=${COOKIE_DOMAIN:localhost}

# SSL Configuration (disabled for testing)
server.ssl.enabled=false
# server.ssl.key-store=${SSL_KEYSTORE:keystore.p12}
# server.ssl.key-store-password=${SSL_PASSWORD:fix4home}
# server.ssl.keyStoreType=PKCS12
# server.ssl.keyAlias=tomcat

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# File Storage Configuration
file.storage.type=local
file.storage.local.upload-dir=uploads/
file.storage.local.base-url=http://localhost:8100/api/v1/files/
file.storage.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,txt
file.storage.max-file-size=10485760
file.storage.image.max-width=2048
file.storage.image.max-height=2048
file.storage.image.thumbnail.width=300
file.storage.image.thumbnail.height=300

# AWS S3 Configuration (for cloud storage)
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:}
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${AWS_S3_BUCKET:fix4home-files}

# Logging Configuration
logging.level.com.fix4home=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Rate Limiting
rate.limit.refresh.requests=10
rate.limit.refresh.duration=60

# Push Notification Configuration
push.notification.enabled=true
push.notification.fcm.service-account-key=${FCM_SERVICE_ACCOUNT_KEY:src/main/resources/firebase-service-account.json}
push.notification.fcm.project-id=${FCM_PROJECT_ID:fix4home-app}
push.notification.apns.certificate-path=${APNS_CERTIFICATE_PATH:src/main/resources/apns-certificate.p12}
push.notification.apns.certificate-password=${APNS_CERTIFICATE_PASSWORD:}
push.notification.apns.production=${APNS_PRODUCTION:false}
push.notification.batch-size=100
push.notification.retry-attempts=3
push.notification.retry-delay-seconds=5

# Email Verification Service Configuration
email.verification.service.url=http://localhost:8200
email.verification.service.api-key=${EMAIL_VERIFICATION_API_KEY:fix4home_prod_123abc456def789}
email.verification.system.name=Fix4Home

# Email Verification Method Configuration
# Options: "verification_code" (legacy 6-digit code) or "activation_link" (new email links)
email.verification.method=${EMAIL_VERIFICATION_METHOD:activation_link}

# Email Activation Configuration (for activation_link method)
email.activation.frontend.base-url=${FRONTEND_BASE_URL:https://fe.iceteadev.site}
email.activation.allowed-domains=${ACTIVATION_ALLOWED_DOMAINS:http://localhost:3000,http://localhost:8500,https://fix4home.com,https://fe.iceteadev.site}
email.activation.token.expiry-minutes=30
email.activation.max-sends=3
email.activation.resend-cooldown-seconds=60

# N8N Chatbot Configuration
chatbot.n8n.webhook.url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/7ddbb723-2fc3-46d7-acf5-d2c505424025}
chatbot.n8n.timeout=${N8N_TIMEOUT:30000}
chatbot.session.max-message-pairs=${CHATBOT_MAX_MESSAGE_PAIRS:5}

# Monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=fix4home

# Resilience4j Configuration for Email Service
# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.emailService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.emailService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.emailService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.emailService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.emailService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.emailService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.emailService.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.emailService.recordExceptions=java.net.ConnectException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# Retry Configuration
resilience4j.retry.instances.emailService.maxAttempts=3
resilience4j.retry.instances.emailService.waitDuration=1s
resilience4j.retry.instances.emailService.enableExponentialBackoff=true
resilience4j.retry.instances.emailService.exponentialBackoffMultiplier=2
resilience4j.retry.instances.emailService.retryExceptions=java.net.ConnectException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# Retry Configuration for Health Check
resilience4j.retry.instances.emailHealthCheck.maxAttempts=2
resilience4j.retry.instances.emailHealthCheck.waitDuration=500ms
resilience4j.retry.instances.emailHealthCheck.enableExponentialBackoff=false

# Vietnam Administrative API Configuration
vietnam.address.api.url=${VIETNAM_ADDRESS_API_URL:http://localhost:8080/api/v1}
vietnam.address.api.timeout=5000

# Database Backup Configuration
database.backup.enabled=${DB_BACKUP_ENABLED:true}
database.backup.schedule.cron=${DB_BACKUP_CRON:0 0 2 * * ?}
database.backup.retention.days=${DB_BACKUP_RETENTION_DAYS:30}
database.backup.location=${DB_BACKUP_LOCATION:backup/database/}
database.backup.compress=${DB_BACKUP_COMPRESS:true}
database.backup.mysql.bin.path=${MYSQL_BIN_PATH:/usr/bin/}
database.backup.mysql.host=${DB_HOST:localhost}
database.backup.mysql.port=${DB_PORT:3307}
database.backup.mysql.database=${DB_NAME:fix4home_db}
database.backup.mysql.username=${DB_USERNAME:root}
database.backup.mysql.password=${DB_PASSWORD:pass123}
database.backup.notification.enabled=${DB_BACKUP_NOTIFICATION:true}
database.backup.notification.email=${DB_BACKUP_EMAIL:admin@fix4home.com}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache Configuration
cache.default.ttl=3600
cache.enabled=true