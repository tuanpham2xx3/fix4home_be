# Local Development Profile
# This profile is for running the application locally while using Docker for MySQL, Redis, and Email Service
# Only the Spring Boot application runs on local machine

# Server Configuration - Bind to all interfaces for Android Emulator access
# This allows Android Emulator to connect via 10.0.2.2:8100
server.address=0.0.0.0
server.port=8100

# Override database connection for local development
# MySQL is running in Docker on port 3307 (mapped from container port 3306)
spring.datasource.url=jdbc:mysql://localhost:3307/fix4home_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=fix4home
spring.datasource.password=pass123

# Redis is running in Docker on port 6379
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# Email service is running in Docker on port 8200
email.verification.service.url=http://localhost:8200

# Enable debug logging for local development
logging.level.com.fix4home=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Enable Flyway for local development (migrations will run automatically)
spring.flyway.enabled=true

# File storage for local development
file.storage.local.upload-dir=uploads/
file.storage.local.base-url=http://localhost:8100/api/v1/files/

# Frontend URL for activation links
email.activation.frontend.base-url=https://fe.iceteadev.site
# Allowed domains for activation (comma-separated)
email.activation.allowed-domains=http://localhost:3000,http://localhost:8500,https://fix4home.com,https://fe.iceteadev.site

