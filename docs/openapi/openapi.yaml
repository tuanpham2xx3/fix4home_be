openapi: 3.0.3
info:
  title: Fix4Home API
  description: |
    # Fix4Home - Home Repair Service Platform API
    
    Complete API documentation for the Fix4Home platform connecting customers with technicians for home repair services.
    
    ## Features
    - 🔐 JWT-based authentication with email activation
    - 🔑 Temporary password reset via email links
    - 👥 Multi-role support (Customer, Technician, Admin)
    - 🛠️ Service request management
    - 💬 Real-time chat system
    - 💰 Payment processing
    - ⭐ Feedback and ratings
    - 📍 Location-based technician matching
    - 📝 Service post & consultation system
    - 🚨 Complaint handling
    
    ## Authentication
    Most endpoints require authentication via JWT token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
    
    ### Mobile vs Web Client Detection
    The API automatically detects client type based on the `X-Device-Id` header:
    - **Mobile clients**: Include `X-Device-Id` header → Receive refresh token in response body
    - **Web clients**: Omit `X-Device-Id` header → Receive refresh token in HTTP-only cookie (if deviceId provided)
    
    **Mobile Authentication Flow:**
    1. Login/Register with `X-Device-Id` header
    2. Receive `accessToken` and `refreshToken` in response body
    3. Store `refreshToken` securely (Flutter Secure Storage)
    4. Use `refreshToken` in `X-Refresh-Token` header or request body to refresh access token
    
    **Web Authentication Flow:**
    1. Login/Register (with or without `X-Device-Id` header)
    2. Receive `accessToken` in response body
    3. Refresh token stored in HTTP-only cookie (if deviceId provided)
    4. Use cookie automatically for refresh token endpoint
    
    ## Password Reset Flow
    The system uses a temporary password approach for password reset:
    
    1. **Request Reset**: User calls `/auth/forgot-password` with their email
    2. **Email Sent**: System generates a temporary password (e.g., "Abc123def") and sends it via email
    3. **Activation**: User clicks the activation link in the email to activate the temporary password
    4. **Login**: User logs in with the temporary password
    5. **Force Change**: System redirects user to change password (mustChangePassword flag is set)
    
    ### Rate Limiting
    - Maximum 5 password reset emails per hour per email address
    - 60-second cooldown between resend attempts
    - Maximum 3 resend attempts per token
    - Tokens expire after 30 minutes
    
